{% extends "admin/base_site.html" %}

{% block extrastyle %}{{ block.super }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   MULTIMAK 360 - Panel de Django con el mismo tema que erp-theme.css
   Los valores de los TOKENS son los mismos de tu erp-theme.css.
   ========================================================================== */

/* ---------- 1. TOKENS: modo claro ---------- */
:root,
html[data-theme="light"] {
    --font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;

    --bg: #e6ecf4;
    --surface: #ffffff;
    --surface-2: #f3f6fb;
    --th-bg: #0f2a4a;
    --th-fg: #ffffff;
    --hover: #edf3fb;
    --line: #d9e1ec;
    --line-strong: #b4c0d2;
    --navy: #0f2a4a;
    --navy-2: #1a3e68;
    --accent: #0b6bcb;
    --shadow: 0 1px 2px rgba(15, 42, 74, 0.06), 0 4px 14px rgba(15, 42, 74, 0.07);

    --ink: #14181f;
    --ink-2: #3b4452;
    --muted: #667085;

    --primary: #0b5cab;
    --primary-hover: #094a8a;
    --primary-fg: #ffffff;
    --brand: #e8a317;

    --ok: #157347;   --ok-bg: #e8f4ed;   --ok-line: #b7dcc6;
    --err: #b42318;  --err-bg: #fdecea;  --err-line: #f3c1bc;
    --warn: #9a5b00; --warn-bg: #fdf3e0; --warn-line: #f1d9a6;

    --ring: rgba(11, 107, 203, 0.22);
    --r-sm: 4px;
    --r: 6px;
    --r-lg: 8px;
    --ctl-h: 36px;
}

/* ---------- 1b. TOKENS: modo noche ---------- */
html[data-theme="dark"] {
    --bg: #0b0f19;
    --surface: #151e2e;
    --surface-2: #1a2436;
    --th-bg: #1a2436;
    --th-fg: #cbd3df;
    --navy: #101a2c;
    --navy-2: #1a2740;
    --accent: #7db2f0;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    --hover: #1c2739;
    --line: #283548;
    --line-strong: #3a4a60;

    --ink: #f1f4f9;
    --ink-2: #cbd3df;
    --muted: #94a3b8;

    --primary: #e8a317;
    --primary-hover: #f0b23a;
    --primary-fg: #14181f;

    --ok: #5fd39a;   --ok-bg: rgba(95, 211, 154, 0.12);  --ok-line: rgba(95, 211, 154, 0.35);
    --err: #ff8a80;  --err-bg: rgba(255, 138, 128, 0.12); --err-line: rgba(255, 138, 128, 0.35);
    --warn: #f3b657; --warn-bg: rgba(243, 182, 87, 0.12); --warn-line: rgba(243, 182, 87, 0.35);

    --ring: rgba(125, 178, 240, 0.3);
}

/* Si el panel está en "auto" y el sistema operativo está en modo oscuro */
@media (prefers-color-scheme: dark) {
    html[data-theme="auto"] {
        --bg: #0b0f19;
        --surface: #151e2e;
        --surface-2: #1a2436;
        --th-bg: #1a2436;
        --th-fg: #cbd3df;
        --navy: #101a2c;
        --navy-2: #1a2740;
        --accent: #7db2f0;
        --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
        --hover: #1c2739;
        --line: #283548;
        --line-strong: #3a4a60;
        --ink: #f1f4f9;
        --ink-2: #cbd3df;
        --muted: #94a3b8;
        --primary: #e8a317;
        --primary-hover: #f0b23a;
        --primary-fg: #14181f;
        --ok: #5fd39a;   --ok-bg: rgba(95, 211, 154, 0.12);  --ok-line: rgba(95, 211, 154, 0.35);
        --err: #ff8a80;  --err-bg: rgba(255, 138, 128, 0.12); --err-line: rgba(255, 138, 128, 0.35);
        --warn: #f3b657; --warn-bg: rgba(243, 182, 87, 0.12); --warn-line: rgba(243, 182, 87, 0.35);
        --ring: rgba(125, 178, 240, 0.3);
    }
}

/* ---------- 2. Variables propias de Django conectadas a los tokens ---------- */
:root,
html[data-theme="light"],
html[data-theme="dark"],
html[data-theme="auto"] {
    --font-family-primary: var(--font);
    --font-family-monospace: var(--mono);

    --secondary: var(--navy);

    --body-fg: var(--ink);
    --body-bg: var(--bg);
    --body-quiet-color: var(--muted);
    --body-loud-color: var(--ink);

    --header-color: #b6c4d8;
    --header-branding-color: #ffffff;
    --header-bg: var(--navy);
    --header-link-color: #ffffff;

    --breadcrumbs-fg: var(--muted);
    --breadcrumbs-link-fg: var(--accent);
    --breadcrumbs-bg: transparent;

    --link-fg: var(--accent);
    --link-hover-color: var(--primary-hover);
    --link-selected-fg: var(--ink);

    --hairline-color: var(--line);
    --border-color: var(--line-strong);
    --error-fg: var(--err);

    --message-success-bg: var(--ok-bg);
    --message-warning-bg: var(--warn-bg);
    --message-error-bg: var(--err-bg);

    --darkened-bg: var(--surface-2);
    --selected-bg: var(--hover);
    --selected-row: var(--warn-bg);

    --close-button-bg: var(--muted);
    --close-button-hover-bg: var(--ink-2);

    --button-fg: var(--primary-fg);
    --button-bg: var(--primary);
    --button-hover-bg: var(--primary-hover);
    --default-button-bg: var(--primary);
    --default-button-hover-bg: var(--primary-hover);

    --object-tools-fg: var(--primary-fg);
    --object-tools-bg: var(--primary);
    --object-tools-hover-bg: var(--primary-hover);
}

/* ---------- 3. Base ---------- */
html,
body {
    font-family: var(--font);
    font-size: 14px;
    color: var(--ink);
    background-color: var(--bg);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
}

#container {
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
}

#content {
    padding: 16px 32px 48px;
}

#content h1,
#content-main h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
}

a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

/* ---------- 4. Encabezado: mismo banner azul de tus páginas ---------- */
#header {
    margin: 24px 32px 0;
    padding: 18px 26px;
    border-radius: var(--r-lg);
    background: linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 100%);
    box-shadow: var(--shadow);
    width: auto;
}

#site-name a:link,
#site-name a:visited {
    display: inline-flex;
    align-items: center;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #ffffff;
}

#site-name a::before {
    content: "M";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    margin-right: 12px;
    border-radius: var(--r-lg);
    background: var(--brand);
    color: #0f2a4a;
    font-size: 17px;
    font-weight: 700;
}

#user-tools {
    font-size: 13px;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    color: #b6c4d8;
}

#user-tools a:link,
#user-tools a:visited,
#user-tools button {
    color: #f5b73c;
    font-weight: 500;
    border-bottom: none;
}

#user-tools a:hover,
#user-tools button:hover {
    color: #ffffff;
    text-decoration: underline;
}

/* ---------- 5. Migas de pan ---------- */
div.breadcrumbs {
    padding: 14px 32px 0;
    font-size: 13px;
    text-transform: none;
    letter-spacing: 0;
    background: transparent;
    border: none;
}

/* ---------- 6. Tarjetas ---------- */
.module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
}

.module h2,
.module caption,
.inline-group h2 {
    padding: 10px 14px;
    background: var(--th-bg);
    color: var(--th-fg);
    font-size: 12px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
}

.module h2 a:link,
.module h2 a:visited,
.module caption a:link,
.module caption a:visited {
    color: var(--th-fg);
}

.module h3 {
    color: var(--ink);
    font-weight: 600;
}

/* ---------- 7. Tablas ---------- */
table thead th,
.module table thead th,
#result_list thead th {
    padding: 10px 14px;
    background-color: var(--th-bg);
    color: var(--th-fg);
    font-size: 12px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
    border-bottom: none;
    white-space: nowrap;
}

#result_list thead th a:link,
#result_list thead th a:visited,
#result_list thead th .text a,
#result_list thead th .text span {
    color: var(--th-fg);
}

#result_list thead th.sorted {
    background-color: var(--navy-2);
}

tbody tr.row1,
tbody tr.row2 {
    background: transparent;
}

tbody td,
tbody th {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
}

tbody tr:last-child td,
tbody tr:last-child th {
    border-bottom: none;
}

tbody tr:hover td,
tbody tr:hover th {
    background-color: var(--hover);
}

#result_list tbody tr.selected td,
#result_list tbody tr.selected th {
    background-color: var(--selected-row);
}

#changelist #toolbar {
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
}

#changelist-filter {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
}

#changelist-filter h2 {
    background: var(--th-bg);
    color: var(--th-fg);
}

#changelist-filter li.selected a {
    color: var(--accent);
    font-weight: 600;
}

/* ---------- 8. Formularios ---------- */
label,
.form-row label,
.aligned label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
    text-transform: none;
    letter-spacing: 0;
}

input[type="text"],
input[type="password"],
input[type="email"],
input[type="url"],
input[type="number"],
input[type="tel"],
input[type="date"],
input[type="time"],
input[type="search"],
select:not([multiple]),
.vTextField {
    height: var(--ctl-h);
    padding: 0 12px;
    background-color: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    box-shadow: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 400;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
}

textarea,
select[multiple] {
    padding: 8px 12px;
    background-color: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    font-family: var(--font);
    font-size: 13px;
}

input[type="text"]:focus,
input[type="password"]:focus,
input[type="email"]:focus,
input[type="url"]:focus,
input[type="number"]:focus,
input[type="tel"]:focus,
input[type="date"]:focus,
input[type="time"]:focus,
input[type="search"]:focus,
select:focus,
textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--ring);
    outline: none;
}

fieldset.module {
    border-radius: var(--r-lg);
}

/* ---------- 9. Botones ---------- */
/* Secundario (por defecto) */
.button,
a.button,
input[type="submit"],
input[type="button"],
.submit-row input {
    height: var(--ctl-h);
    padding: 0 14px;
    background-color: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    box-shadow: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    transition: background-color 0.12s ease;
}

.button:hover,
a.button:hover,
input[type="submit"]:hover,
input[type="button"]:hover,
.submit-row input:hover {
    background-color: var(--hover);
    border-color: var(--muted);
    color: var(--ink);
}

/* Primario: el botón "Guardar" */
.button.default,
input[type="submit"].default,
.submit-row input.default {
    background-color: var(--primary);
    color: var(--primary-fg);
    border: 1px solid var(--primary);
    font-weight: 600;
}

.button.default:hover,
input[type="submit"].default:hover,
.submit-row input.default:hover {
    background-color: var(--primary-hover);
    border-color: var(--primary-hover);
    color: var(--primary-fg);
}

.submit-row a.deletelink {
    border-radius: var(--r);
    font-weight: 600;
    text-transform: none;
}

/* "Añadir ..." arriba a la derecha */
.object-tools a:link,
.object-tools a:visited {
    padding: 6px 14px;
    border-radius: var(--r);
    font-size: 13px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
}

/* ---------- 10. Mensajes ---------- */
ul.messagelist li {
    padding: 10px 14px;
    border-radius: var(--r);
    border-left: 3px solid var(--line-strong);
    font-size: 13px;
    font-weight: 500;
    box-shadow: none;
}

ul.messagelist li.success {
    background-color: var(--ok-bg);
    color: var(--ok);
    border-left-color: var(--ok);
}

ul.messagelist li.warning {
    background-color: var(--warn-bg);
    color: var(--warn);
    border-left-color: var(--warn);
}

ul.messagelist li.error {
    background-color: var(--err-bg);
    color: var(--err);
    border-left-color: var(--err);
}
</style>
{% endblock %}
